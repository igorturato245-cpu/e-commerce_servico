{% extends 'global/base.html' %}

{% block content %}
  <div class="auth-container">
    <div class="auth-card">
      <h2>Cadastro</h2>
      <form method="post" action="{% url 'cadastro_login:cadastro' %}">
        {% csrf_token %}
        {% include 'cadastro_de_usuarios/partials/_user_form.html'%}
        <button type="submit">Enviar</button>
      </form>
      <div>
        <p>
          Já tem cadastro?
          <a href="{% url 'cadastro_login:login' %}{% if request.GET.next %}
              ?next={{ request.GET.next }}
            {% endif %}">
            Clique aqui
          </a>
        </p>
      </div>
      {% url 'cadastro_login:index' as url_home %}
      <button style="margin-top: 20px; text-align: center; border: none; background-color: white; cursor: pointer;" type="button" onclick="if (document.referrer) { window.location.href = document.referrer; } else { window.location.href = '{% url 'index:index' %}'; }">Voltar</button>
    </div>
  </div>


{% endblock %}
